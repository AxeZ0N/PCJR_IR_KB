# pcjr.conf – Configuration for the PCJR toolkit
# Source this from pcjr.sh or manually tweak the values below.

# ------ Serial / Arduino ------
SERIAL_DEVICE="/dev/ttyACM0"
SERIAL_BAUD=600
FQBN="arduino:avr:mega"
BUILD_DIR="./pcjr_ir_bridge/build"

# ------ RTSP stream viewer (mpv) ------
STREAM_IP="192.168.4.34"
STREAM_PORT="8554"
STREAM_PATH="/cam"

# ------ Python driver ------
PYTHON_DRIVER="./pcjr_control.py"

# MediaMTX settings
MEDIAMTX_CONFIG="./mediamtx.yml"          # source config in repo
MEDIAMTX_INSTALL_DIR="/usr/local/bin"     # where to put the binary
MEDIAMTX_SERVICE_NAME="mediamtx"          # systemd service name
